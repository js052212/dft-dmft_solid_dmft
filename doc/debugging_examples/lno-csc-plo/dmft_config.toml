[general]
seedname = "vasp"
csc = true

n_iter_dmft_first = 3
n_iter_dmft_per = 2
n_iter_dmft = 15

block_threshold = 0.0001
enforce_off_diag = true

h_int_type = "kanamori"
h_int_basis = "vasp"
U = 2.04
J = 0.47
beta = 40
prec_mu = 0.0001

dc_type = 1
dc = true
dc_dmft = true
calc_energies = true

[solver]
type = "cthyb"
n_l = 25
length_cycle = 140
n_warmup_cycles = 8000
n_cycles_tot = 30e+6
imag_threshold = 1e-5
measure_G_l = false
legendre_fit = true
measure_density_matrix = true

[dft]
dft_code = "vasp"
projector_type = "plo"
plo_cfg = "plo.cfg"
n_iter = 10
n_cores = 4
mpi_env = "default"
dft_exec = "vasp_std"
