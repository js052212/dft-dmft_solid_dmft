[general]
seedname = "wannier90"
csc = true

n_iter_dmft_first = 5
n_iter_dmft_per = 1
n_iter_dmft = 10

block_threshold = 0.0001
enforce_off_diag = true

h_int_type = "kanamori"
h_int_basis = "vasp"
U = 2.04
J = 0.47
beta = 40
prec_mu = 0.0001

dc_type = 1
dc = true
dc_dmft = true
calc_energies = true

[solver]
type = "cthyb"
n_l = 25
length_cycle = 200
n_warmup_cycles = 10000
n_cycles_tot = 10e+6
imag_threshold = 1e-5
measure_G_l = true
measure_density_matrix = true

[dft]
dft_code = "vasp"
projector_type = "w90"
w90_exec = "wannier90.x"
w90_tolerance = 1e-6
n_iter = 15
n_cores = 16
mpi_env = "default"
mpi_exe = "mpirun"
dft_exec = "vasp_std"
